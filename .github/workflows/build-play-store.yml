name: Build Play Store (AAB signé)

# À lancer à la main : onglet Actions > "Build Play Store (AAB signé)" > Run workflow.
# Prérequis (une seule fois), dans Settings > Secrets and variables > Actions :
#   Secrets   : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Variables : API_BASE_URL  (ex. https://retraite-api.up.railway.app, SANS "/" à la fin, en https)
# Le guide pas à pas est dans docs/PLAY_STORE.md.
on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retraite_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Secrets manquants (voir docs/PLAY_STORE.md) :$missing"; exit 1; fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::La variable API_BASE_URL doit commencer par https:// (valeur actuelle : '$API_BASE_URL')"; exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Préparer la clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # Numéro de version = numéro d'exécution du workflow : il augmente à chaque build, comme l'exige le Play Store.
      - name: Construire le fichier .aab
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=ALLOW_SERVER_EDIT=false

      - uses: actions/upload-artifact@v4
        with:
          name: retraite-playstore-aab
          path: retraite_mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
