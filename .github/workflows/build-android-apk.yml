name: Build Android APK

on:
  push:
    branches:
      - claude/retraite-backend-day1-lv91aj
    paths:
      - "retraite_mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retraite_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: retraite-apk
          path: retraite_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
